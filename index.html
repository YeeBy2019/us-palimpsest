<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>us-palimpsest — an American history map you can walk into</title>
    <meta
      name="description"
      content="An interactive atlas of American history: engraved by hand, dissolved in dots, time as the first citizen."
    />
    <!-- The atlas's own mark: the lower forty-eight, cut from the same paper the
         plate is printed on. A real multi-size ICO rather than a renamed PNG, so
         the tab bar can take the size it wants. -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <!-- Same drawing as a plain PNG, for engines that would rather not reason
         about an ICO container. -->
    <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32" />
    <!-- iOS flattens transparency to black, so this one carries its own plate. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- What to wear if `ui.css` never arrives.

         The stylesheet is linked from `<head>` below, which makes it
         render-blocking: the browser paints nothing until it lands, so in the
         ordinary case there is no unstyled frame to see. But a stylesheet can
         also fail, and a failed one unblocks rendering and leaves the browser's
         defaults as the only styling — a heading in Arial, a blue range input,
         two default buttons, on white. That is what this block covers: it paints
         the paper and keeps the chrome out of sight until there is a sheet to
         print it on. Verified by blocking the request outright, which degrades
         to a plain sheet with the plate still drawn on it.

         The rules sit in a cascade layer deliberately. Unlayered declarations
         always beat layered ones, so `ui.css` wins here wherever a bundler
         decides to put it; without the layer this would quietly depend on
         arriving second. -->
    <style>
      @layer boot {
        html,
        body {
          margin: 0;
          overflow: hidden;
          /* A copy of `--paper-deep`, which is defined in the file that may not
             have loaded. Kept in step with the renderer's clear colour, as that
             file's own copy is. */
          background: #d8c7a4;
          color: #2f261c;
        }

        .chrome,
        .card,
        .loader,
        .fatal {
          display: none;
        }
      }
    </style>
    <!-- Linked rather than imported from `src/main.js`, so the preload scanner
         finds it while the HTML is still being parsed. Imported from JavaScript,
         the sheet could not start downloading until `main.js` and everything
         behind it — three.js included — had been fetched and run, and the chrome
         spent that time on screen in the browser's own default style.

         `?direct` is a dev-server requirement: without it Vite answers with a
         JavaScript module that injects the styles, which a `<link rel=
         "stylesheet">` cannot use — it would be refused and the app would be
         unstyled in development and nowhere else. A production build resolves
         the path, drops the suffix and emits the bundled asset. -->
    <link rel="stylesheet" href="/src/ui/ui.css?direct" />
  </head>
  <body>
    <!-- The world. Everything else on this page is DOM: the loader, the cards,
         the chrome. Only the sheet is WebGL, which keeps text crisp at any
         resolution and keeps the interface cheap to change. -->
    <div id="stage">
      <canvas id="scene"></canvas>
    </div>

    <div class="chrome">
      <header class="masthead">
        <h1>us&#8209;palimpsest</h1>
        <p class="tagline">
          An American history map you can walk into. Engraved by hand, dissolved in dots,
          time as the first citizen.
        </p>
      </header>

      <nav class="chapters" id="chapters" aria-label="Chapters"></nav>

      <footer class="dock">
        <div class="dock__date">
          <output class="dock__stamp" id="stamp" for="scrub">—</output>
          <input
            class="dock__scrub"
            id="scrub"
            type="range"
            min="0"
            max="1000"
            value="0"
            step="1"
            aria-label="Date within this chapter"
          />
        </div>

        <div class="dock__controls">
          <button class="dock__button" id="play" type="button" aria-pressed="false">Play</button>
          <button class="dock__button" id="rewind" type="button">Restart</button>
          <p class="dock__material" id="material"></p>
        </div>
      </footer>
    </div>

    <!-- The chapter card: the only thing that ever covers the sheet, and it is
         made of the same paper. -->
    <div class="card" id="card" aria-hidden="true">
      <div class="card__inner">
        <p class="card__index" id="card-index"></p>
        <h2 class="card__name" id="card-name"></h2>
        <p class="card__material" id="card-material"></p>
      </div>
    </div>

    <div class="loader" id="loader">
      <svg class="loader__mark" viewBox="0 0 120 120" aria-hidden="true">
        <!-- An engraved line drawing itself, the way the boundaries will. -->
        <path
          id="loader-path"
          d="M60 12 C 86 12, 106 32, 106 58 C 106 84, 86 108, 60 108 C 34 108, 14 84, 14 58 C 14 32, 34 12, 60 12 Z M60 30 C 78 30, 88 42, 88 58 C 88 74, 78 86, 60 86 C 42 86, 32 74, 32 58 C 32 42, 42 30, 60 30 Z"
          fill="none"
        />
      </svg>
      <p class="loader__text" id="loader-text">Grinding the ink</p>
    </div>

    <noscript>
      <p class="fatal">
        This atlas is drawn in WebGL. It needs JavaScript, and a browser with a GPU.
      </p>
    </noscript>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
